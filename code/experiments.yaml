# PA-STFed 结项实验矩阵
# 默认 all 只运行 baseline、集中式、FedAvg、FedProx、个性化头、本地独立训练和一个结构消融。
# 额外基线、DP 与最终测试必须显式指定实验名，避免无边界烧算力。

seeds: [2026, 2027, 2028]

formal_centralized_training: &formal_centralized_training
  centralized_batch_size: 16
  eval_batch_size: 64
  epochs: 30
  patience: 7
  max_train_windows: null
  max_val_windows: null
  max_train_diagnostic_windows: 2048
  learning_rate: 0.002
  weight_decay: 0.0001
  selection_metric: wape
  early_stop_min_delta: 0.01
  evaluate_test: false
  scheduler:
    name: reduce_on_plateau
    factor: 0.5
    patience: 2
    min_lr: 0.00001

formal_federated_training: &formal_federated_training
  federated_batch_size: 512
  eval_batch_size: 256
  # Windows 下多进程 DataLoader 会为每个 batch 创建共享内存映射；在长时间
  # 联邦运行中容易触发 error 1455。客户端子图很小，改为主进程加载可避免
  # 该系统级故障，GPU 计算仍由模型前向/反向过程承担。
  num_workers: 0
  persistent_workers: false
  selection_metric: wape
  early_stop_min_delta: 0.01
  evaluate_test: false

experiments:
  # Stage 1 本地烟测：仅验证数值与训练流程，不进入正式结果汇总或论文表格。
  stage1_smoke_centralized:
    task: centralized
    tag: stage1_smoke_centralized_seed{seed}
    seed_count: 1
    include_in_all: false
    overrides:
      data: {graph: topology_knn, target_knn_k: 6}
      model: {architecture: pa_stfed}
      training:
        <<: *formal_centralized_training
        epochs: 2
        patience: 2
        centralized_batch_size: 8
        eval_batch_size: 16
        num_workers: 0
        persistent_workers: false
        max_train_windows: 128
        max_val_windows: 64
        max_train_diagnostic_windows: 64
        smoke_checks: true
        evaluate_test: false
      privacy: {enabled: false}

  stage1_smoke_fedavg:
    task: federated
    tag: stage1_smoke_fedavg_seed{seed}
    seed_count: 1
    include_in_all: false
    overrides:
      data: {graph: topology_knn, target_knn_k: 6}
      training:
        <<: *formal_federated_training
        federated_batch_size: 64
        eval_batch_size: 64
        max_train_windows: 128
        max_val_windows: 64
        max_train_diagnostic_windows: 64
        smoke_checks: true
        evaluate_test: false
      federated:
        algorithm: FedAvg
        rounds: 2
        local_epochs: 1
        mu: 0.0
        personalized_head: false
      privacy: {enabled: false}

  baseline:
    task: baselines
    tag: baseline_grouped_seed{seed}
    seed_count: 1
    overrides:
      training: {<<: *formal_centralized_training}

  centralized:
    task: centralized
    tag: centralized_seed{seed}
    seed_count: 3
    overrides:
      model: {architecture: pa_stfed}
      training: {<<: *formal_centralized_training}
      privacy: {enabled: false}

  fedavg:
    task: federated
    tag: fedavg_grouped_seed{seed}
    seed_count: 3
    overrides:
      training: {<<: *formal_federated_training}
      federated: {algorithm: FedAvg, mu: 0.0, personalized_head: false}
      privacy: {enabled: false}

  fedprox_005:
    task: federated
    tag: fedprox005_grouped_seed{seed}
    seed_count: 3
    overrides:
      training: {<<: *formal_federated_training}
      federated: {algorithm: FedProx, mu: 0.005, personalized_head: false}
      privacy: {enabled: false}

  personalized_head:
    task: federated
    tag: personalized_head_seed{seed}
    seed_count: 3
    overrides:
      training: {<<: *formal_federated_training}
      federated: {algorithm: FedAvg, mu: 0.0, personalized_head: true}
      privacy: {enabled: false}

  local_only:
    task: federated
    tag: local_only_seed{seed}
    seed_count: 3
    overrides:
      training: {<<: *formal_federated_training}
      federated: {algorithm: LocalOnly, mu: 0.0, personalized_head: false}
      privacy: {enabled: false}

  # Stage 3B 收敛审计：只将对应 Stage 3 配置的联邦轮数延长到 40。
  # 不用于默认 all 矩阵，避免误启动长训练；结果标签带 r40 防止覆盖原结果。
  local_only_r40:
    task: federated
    tag: local_only_r40_seed{seed}
    seed_count: 1
    include_in_all: false
    overrides:
      data: {graph: topology_knn, target_knn_k: 6}
      training: {<<: *formal_federated_training}
      federated:
        algorithm: LocalOnly
        rounds: 40
        local_epochs: 1
        mu: 0.0
        personalized_head: false
      privacy: {enabled: false}

  fedavg_r40:
    task: federated
    tag: fedavg_r40_seed{seed}
    seed_count: 1
    include_in_all: false
    overrides:
      data: {graph: topology_knn, target_knn_k: 6}
      training: {<<: *formal_federated_training}
      federated:
        algorithm: FedAvg
        rounds: 40
        local_epochs: 1
        mu: 0.0
        personalized_head: false
      privacy: {enabled: false}

  fedprox_005_r40:
    task: federated
    tag: fedprox005_r40_seed{seed}
    seed_count: 1
    include_in_all: false
    overrides:
      data: {graph: topology_knn, target_knn_k: 6}
      training: {<<: *formal_federated_training}
      federated:
        algorithm: FedProx
        rounds: 40
        local_epochs: 1
        mu: 0.005
        personalized_head: false
      privacy: {enabled: false}

  personalized_head_r40:
    task: federated
    tag: personalized_head_r40_seed{seed}
    seed_count: 1
    include_in_all: false
    overrides:
      data: {graph: topology_knn, target_knn_k: 6}
      training: {<<: *formal_federated_training}
      federated:
        algorithm: FedAvg
        rounds: 40
        local_epochs: 1
        mu: 0.0
        personalized_head: true
      privacy: {enabled: false}

  # 固定 Stage 0 的全局 topology-kNN(k=6)，仅开关物理图和功能图分支。
  spatial_physical_only:
    task: centralized
    tag: spatial_physical_only_seed{seed}
    seed_count: 3
    include_in_all: false
    overrides:
      data: {graph: topology_knn, target_knn_k: 6}
      model:
        architecture: pa_stfed
        use_physical: true
        use_functional: false
        use_spatial_gate: false
        use_temporal_gate: true
      training: {<<: *formal_centralized_training}
      privacy: {enabled: false}

  spatial_functional_only:
    task: centralized
    tag: spatial_functional_only_seed{seed}
    seed_count: 3
    include_in_all: false
    overrides:
      data: {graph: topology_knn, target_knn_k: 6}
      model:
        architecture: pa_stfed
        use_physical: false
        use_functional: true
        use_spatial_gate: false
        use_temporal_gate: true
      training: {<<: *formal_centralized_training}
      privacy: {enabled: false}

  spatial_dual_graph:
    task: centralized
    tag: spatial_dual_graph_seed{seed}
    seed_count: 3
    include_in_all: false
    overrides:
      data: {graph: topology_knn, target_knn_k: 6}
      model:
        architecture: pa_stfed
        use_physical: true
        use_functional: true
        use_spatial_gate: true
        use_temporal_gate: true
      training: {<<: *formal_centralized_training}
      privacy: {enabled: false}

  # LSTM：Kong et al., IEEE Transactions on Smart Grid, 2019。
  load_lstm_validation:
    task: centralized
    tag: load_lstm_validation_seed{seed}
    seed_count: 3
    include_in_all: false
    overrides:
      model: {architecture: lstm, hidden_dim: 64}
      baselines: {lstm_layers: 2}
      training: {<<: *formal_centralized_training}
      privacy: {enabled: false}

  # iTransformer：Liu et al., ICLR 2024。
  itransformer_validation:
    task: centralized
    tag: itransformer_validation_seed{seed}
    seed_count: 3
    include_in_all: false
    overrides:
      model: {architecture: itransformer, hidden_dim: 64}
      baselines: {itransformer_layers: 2, itransformer_heads: 4}
      training: {<<: *formal_centralized_training}
      privacy: {enabled: false}

  # AGCRN 与 Graph WaveNet 是通用时空图迁移基线，原始论文主要面向交通。
  agcrn:
    task: centralized
    tag: agcrn_seed{seed}
    seed_count: 3
    include_in_all: false
    overrides:
      model: {architecture: agcrn, hidden_dim: 64}
      training: {<<: *formal_centralized_training}
      privacy: {enabled: false}

  gwnet:
    task: centralized
    tag: gwnet_seed{seed}
    seed_count: 3
    include_in_all: false
    overrides:
      model: {architecture: gwnet, hidden_dim: 64}
      training: {<<: *formal_centralized_training}
      privacy: {enabled: false}

  # Auxiliary validation：8D calendar screening，不纳入最终 5D 主模型矩阵。
  calendar_pa_screen:
    task: centralized
    tag: calendar_pa_screen_seed{seed}
    seed_count: 1
    include_in_all: false
    overrides:
      model: {architecture: pa_stfed, input_dim: 8}
      training: {<<: *formal_centralized_training}
      privacy: {enabled: false}

  calendar_gwnet_screen:
    task: centralized
    tag: calendar_gwnet_screen_seed{seed}
    seed_count: 1
    include_in_all: false
    overrides:
      model: {architecture: gwnet, hidden_dim: 64, input_dim: 8}
      training: {<<: *formal_centralized_training}
      privacy: {enabled: false}

  calendar_lstm_screen:
    task: centralized
    tag: calendar_lstm_screen_seed{seed}
    seed_count: 1
    include_in_all: false
    overrides:
      model: {architecture: lstm, hidden_dim: 64, input_dim: 8}
      baselines: {lstm_layers: 2}
      training: {<<: *formal_centralized_training}
      privacy: {enabled: false}

  # ModuleALA 最小烟测：inspired by/adapted from FedALA，验证第二轮逐元素
  # alpha 初始化与个性化验证状态；不声称复现原始 FedALA。
  # 不纳入默认矩阵，不作为正式论文结果。
  stage_ala_smoke:
    task: federated
    tag: stage_ala_smoke_seed{seed}
    seed_count: 1
    include_in_all: false
    overrides:
      data: {graph: topology_knn, target_knn_k: 6}
      training:
        <<: *formal_federated_training
        max_train_windows: 128
        max_val_windows: 64
        max_train_diagnostic_windows: 64
        smoke_checks: true
        evaluate_test: false
      federated:
        algorithm: ModuleALA
        mu: 0.0
        rounds: 2
        local_epochs: 1
        patience: 5
        ala_sample_ratio: 0.05
        ala_weight_lr: 1.0
        ala_initial_epochs: 1
        ala_adapt_epochs: 1
        vanilla_ala_layer_idx: 2
        personalized_head: false
      privacy: {enabled: false}

  stage_modulelocal_smoke:
    task: federated
    tag: stage_modulelocal_smoke_seed{seed}
    seed_count: 1
    include_in_all: false
    overrides:
      data: {graph: topology_knn, target_knn_k: 6}
      training:
        <<: *formal_federated_training
        max_train_windows: 128
        max_val_windows: 64
        max_train_diagnostic_windows: 64
        smoke_checks: true
        evaluate_test: false
      federated:
        algorithm: ModuleLocal
        mu: 0.0
        rounds: 2
        local_epochs: 1
        patience: 5
        personalized_head: false
      privacy: {enabled: false}

  # Vanilla FedALA skeleton：按层级高层选择，独立于 ModuleALA 的模块语义分组。
  stage_fedala_smoke:
    task: federated
    tag: stage_fedala_smoke_seed{seed}
    seed_count: 1
    include_in_all: false
    overrides:
      data: {graph: topology_knn, target_knn_k: 6}
      training:
        <<: *formal_federated_training
        max_train_windows: 128
        max_val_windows: 64
        max_train_diagnostic_windows: 64
        smoke_checks: true
        evaluate_test: false
      federated:
        algorithm: VanillaFedALA
        mu: 0.0
        rounds: 2
        local_epochs: 1
        patience: 5
        ala_sample_ratio: 0.05
        ala_weight_lr: 1.0
        ala_initial_epochs: 1
        ala_adapt_epochs: 1
        vanilla_ala_layer_idx: 2
        personalized_head: false
      privacy: {enabled: false}

  # Development screening only; no formal result aggregation or test evaluation.
  modulelocal_dev:
    task: federated
    tag: modulelocal_dev_seed{seed}
    seed_count: 1
    include_in_all: false
    result_scope: development
    overrides:
      data: {graph: topology_knn, target_knn_k: 6}
      training:
        <<: *formal_federated_training
        evaluate_test: false
      federated:
        algorithm: ModuleLocal
        mu: 0.0
        rounds: 20
        local_epochs: 1
        patience: 5
        personalized_head: false
      privacy: {enabled: false}

  # FedALA-style generic last-k layer ALA baseline; this is not an item-by-item
  # reproduction of original FedALA and does not use ModuleALA module semantics.
  layerala_dev:
    task: federated
    tag: layerala_dev_seed{seed}
    seed_count: 1
    include_in_all: false
    result_scope: development
    overrides:
      data: {graph: topology_knn, target_knn_k: 6}
      training:
        <<: *formal_federated_training
        evaluate_test: false
      federated:
        algorithm: VanillaFedALA
        mu: 0.0
        vanilla_ala_layer_idx: 10
        rounds: 20
        local_epochs: 1
        patience: 5
        ala_sample_ratio: 0.80
        ala_max_windows: 2048
        ala_weight_lr: 1.0
        ala_initial_epochs: 1
        ala_adapt_epochs: 1
        personalized_head: false
      privacy: {enabled: false}

  moduleala_dev:
    task: federated
    tag: moduleala_dev_seed{seed}
    seed_count: 1
    include_in_all: false
    result_scope: development
    overrides:
      data: {graph: topology_knn, target_knn_k: 6}
      training:
        <<: *formal_federated_training
        evaluate_test: false
      federated:
        algorithm: ModuleALA
        mu: 0.0
        rounds: 20
        local_epochs: 1
        patience: 5
        ala_sample_ratio: 0.80
        ala_max_windows: 2048
        ala_weight_lr: 1.0
        ala_initial_epochs: 1
        ala_adapt_epochs: 1
        personalized_head: false
      privacy: {enabled: false}

  # Development-only screening：在当前 centralized PA-STFed 上启用持久性残差锚定。
  # 输出语义为最后观测负荷加网络学习的修正量，不纳入 formal 主账本。
  pa_residual_anchor_dev:
    task: centralized
    tag: pa_residual_anchor_dev_seed{seed}
    seed_count: 1
    include_in_all: false
    result_scope: development
    overrides:
      data: {graph: topology_knn, target_knn_k: 6}
      model:
        architecture: pa_stfed
        use_residual_anchor: true
      training:
        <<: *formal_centralized_training
        evaluate_test: false
      privacy: {enabled: false}

  # Development-only residual-anchor loss screens. Scales are training-split IQR;
  # no validation/test statistics or future feeder labels are used.
  pa_residual_scale_loss_dev:
    task: centralized
    tag: pa_residual_scale_loss_dev_seed{seed}
    seed_count: 1
    include_in_all: false
    result_scope: development
    overrides:
      data: {graph: topology_knn, target_knn_k: 6}
      model:
        architecture: pa_stfed
        use_residual_anchor: true
      training:
        <<: *formal_centralized_training
        loss_mode: scale_aware
        scale_source: train_iqr
        feeder_loss_weight: 0.0
        evaluate_test: false
      privacy: {enabled: false}

  pa_residual_multilevel_loss_dev:
    task: centralized
    tag: pa_residual_multilevel_loss_dev_seed{seed}
    seed_count: 1
    include_in_all: false
    result_scope: development
    overrides:
      data: {graph: topology_knn, target_knn_k: 6}
      model:
        architecture: pa_stfed
        use_residual_anchor: true
      training:
        <<: *formal_centralized_training
        loss_mode: multilevel
        scale_source: train_iqr
        feeder_loss_weight: 0.1
        evaluate_test: false
      privacy: {enabled: false}

  pa_residual_multilevel_l002_dev:
    task: centralized
    tag: pa_residual_multilevel_l002_dev_seed{seed}
    seed_count: 1
    include_in_all: false
    result_scope: development
    overrides:
      data: {graph: topology_knn, target_knn_k: 6}
      model:
        architecture: pa_stfed
        use_residual_anchor: true
      training:
        <<: *formal_centralized_training
        loss_mode: multilevel
        scale_source: train_iqr
        feeder_loss_weight: 0.02
        evaluate_test: false
      privacy: {enabled: false}

  pa_residual_multilevel_l005_dev:
    task: centralized
    tag: pa_residual_multilevel_l005_dev_seed{seed}
    seed_count: 1
    include_in_all: false
    result_scope: development
    overrides:
      data: {graph: topology_knn, target_knn_k: 6}
      model:
        architecture: pa_stfed
        use_residual_anchor: true
      training:
        <<: *formal_centralized_training
        loss_mode: multilevel
        scale_source: train_iqr
        feeder_loss_weight: 0.05
        evaluate_test: false
      privacy: {enabled: false}

  # Development-only temporal screen: causal two-layer TCN in parallel with the
  # unchanged causal Transformer, fused by a learnable sigmoid gate.
  pa_multilevel_tcn_transformer_dev:
    task: centralized
    tag: pa_multilevel_tcn_transformer_dev_seed{seed}
    seed_count: 1
    include_in_all: false
    result_scope: development
    overrides:
      data: {graph: topology_knn, target_knn_k: 6}
      model:
        architecture: pa_stfed
        temporal_architecture: tcn_transformer
        tcn_kernel_size: 3
        use_residual_anchor: true
      training:
        <<: *formal_centralized_training
        loss_mode: multilevel
        scale_source: train_iqr
        feeder_loss_weight: 0.1
        evaluate_test: false
      privacy: {enabled: false}

  # Development-only dynamic residual functional graph screen. Static functional
  # graph behavior remains the default and is unchanged for all existing jobs.
  pa_dynamic_functional_scale_dev:
    task: centralized
    tag: pa_dynamic_functional_scale_dev_seed{seed}
    seed_count: 1
    include_in_all: false
    result_scope: development
    overrides:
      data: {graph: topology_knn, target_knn_k: 6}
      model:
        architecture: pa_stfed
        functional_graph_mode: dynamic_residual
        dynamic_context_steps: 12
        dynamic_gain_init: 0.0
        temporal_architecture: transformer
        use_residual_anchor: true
      training:
        <<: *formal_centralized_training
        loss_mode: scale_aware
        scale_source: train_iqr
        feeder_loss_weight: 0.0
        evaluate_test: false
      privacy: {enabled: false}

  # Development-only multiscale patch temporal screen.  The original causal
  # Transformer remains active; the patch branch is added with zero initial gain.
  pa_multiscale_patch_scale_dev:
    task: centralized
    tag: pa_multiscale_patch_scale_dev_seed{seed}
    seed_count: 1
    include_in_all: false
    result_scope: development
    overrides:
      data: {graph: topology_knn, target_knn_k: 6}
      model:
        architecture: pa_stfed
        use_physical: true
        use_functional: true
        functional_graph_mode: static
        temporal_architecture: transformer
        use_residual_anchor: true
        use_multiscale_patch_branch: true
        patch_sizes: [4, 12, 24]
        patch_strides: [2, 6, 12]
        patch_transformer_layers: 1
        patch_transformer_heads: 4
        patch_gain_init: 0.0
      training:
        <<: *formal_centralized_training
        loss_mode: scale_aware
        scale_source: train_iqr
        feeder_loss_weight: 0.0
        evaluate_test: false
      privacy: {enabled: false}

  # 每轮 8/8 客户端全参与，故 q=1；记录 C=1、sigma=3.2、delta=1e-5 和 epsilon。
  dp_fedavg:
    task: federated
    tag: dp_fedavg_seed{seed}
    seed_count: 3
    include_in_all: false
    overrides:
      training: {<<: *formal_federated_training}
      federated: {algorithm: FedAvg, mu: 0.0, personalized_head: false, uniform_mean: true}
      privacy: {enabled: true, clip_norm: 1.0, noise_multiplier: 3.2, delta: 0.00001}

  centralized_test:
    task: centralized
    tag: centralized_test_seed{seed}
    seed_count: 3
    include_in_all: false
    overrides:
      model: {architecture: pa_stfed}
      training:
        <<: *formal_centralized_training
        evaluate_test: true
      privacy: {enabled: false}

  fedavg_test:
    task: federated
    tag: fedavg_test_seed{seed}
    seed_count: 3
    include_in_all: false
    overrides:
      training:
        <<: *formal_federated_training
        evaluate_test: true
      federated: {algorithm: FedAvg, mu: 0.0, personalized_head: false}
      privacy: {enabled: false}

  personalized_head_test:
    task: federated
    tag: personalized_head_test_seed{seed}
    seed_count: 3
    include_in_all: false
    overrides:
      training:
        <<: *formal_federated_training
        evaluate_test: true
      federated: {algorithm: FedAvg, mu: 0.0, personalized_head: true}
      privacy: {enabled: false}
